name: release
on:
  push:
    tags: ["v3.*"]
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Publish the verified artifacts of an existing release run"
        type: string
        required: false
permissions:
  contents: read
jobs:
  checks:
    if: ${{ !inputs.artifact_run_id }}
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: npm run pack:check
      - run: python -m pip install build twine ./server/mfup-core "./server/mfup-fastapi[dev]"
      - run: python -m pytest server/tests -q
      - name: Check tag versions
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check-version.py "${GITHUB_REF_NAME#v}"
      - run: mkdir -p dist-npm dist-py
      - run: npm pack -w @mfup/client -w @mfup/react -w @mfup/server --pack-destination dist-npm
      - run: python scripts/build-python.py dist-py
      - run: twine check dist-py/*
      - run: python scripts/check-artifacts.py dist-npm dist-py
      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: dist-npm/
      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: dist-py/
  source:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.inspect.outputs.publish }}
      run_id: ${{ steps.inspect.outputs.run_id }}
      version: ${{ steps.inspect.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: inspect
        run: python scripts/release-source.py
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
  npm:
    needs: source
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm
          path: dist-npm
          run-id: ${{ needs.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - run: npm install -g npm@11 --no-audit --no-fund
      - name: Publish built artifacts
        run: |
          for artifact in ./dist-npm/*.tgz; do
            name=$(tar -xOf "$artifact" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).name')
            version=$(tar -xOf "$artifact" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already exists"
            else
              npm publish "$artifact" --access public --tag latest --provenance
            fi
          done
  pypi:
    needs: source
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python
          path: dist-py
          run-id: ${{ needs.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-py/
          skip-existing: true

  verify:
    needs: [npm, pypi, source]
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/verify-registry.py "${{ needs.source.outputs.version }}"
      - name: Install public npm packages and run their consumer
        run: |
          mkdir -p /tmp/mfup-registry-check
          cd /tmp/mfup-registry-check
          npm init -y
          npm install --no-audit --no-fund @mfup/client@3.0.0 @mfup/react@3.0.0 @mfup/server@3.0.0 react@18
          cp "$GITHUB_WORKSPACE/scripts/consumer-node-check.mjs" check.mjs
          cp "$GITHUB_WORKSPACE/examples/multiuser-scopes-node/server/server.mjs" example-server.mjs
          node check.mjs
      - name: Install public Python packages and run their consumer
        run: |
          python -m pip install mfup-core==3.0.0 mfup-fastapi==3.0.0 httpx
          python scripts/pack-python-check.py
