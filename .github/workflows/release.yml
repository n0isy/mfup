# Release: build + publish all four packages on a version tag (v0.2.0, …).
#
# NO long-lived tokens anywhere — both registries use OIDC trusted publishing.
#
# One-time setup before the first release:
#   - PyPI (works for FIRST publish): pypi.org → Account → Publishing →
#     "Add a new pending publisher" TWICE (mfup-core, mfup-fastapi) with:
#     owner=n0isy, repository=mfup, workflow=release.yml, environment=release.
#     The first tag then CREATES the projects via OIDC.
#   - npm has no "pending publisher": the FIRST publish of @mfup/client and
#     @mfup/react must be done manually once (npm login with 2FA; from repo
#     root: npm publish -w @mfup/client -w @mfup/react --access public).
#     Then on npmjs.com for EACH package: Settings → Publishing access →
#     add Trusted Publisher (GitHub Actions: n0isy/mfup, release.yml,
#     environment release) and select "Require two-factor authentication
#     and disallow tokens". Subsequent tags publish via OIDC below.
#
# Also create the "release" GitHub environment (Settings → Environments).
# Versions: keep package.json / pyproject.toml versions == the tag.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Build npm packages
        run: |
          npm ci
          npm run build
          npm pack -w @mfup/client -w @mfup/react --pack-destination dist-npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python packages
        run: |
          pip install build twine
          python -m build server/mfup-core -o dist-py
          python -m build server/mfup-fastapi -o dist-py
          twine check dist-py/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-npm
          path: dist-npm/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-py
          path: dist-py/

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: release
    permissions:
      id-token: write   # npm trusted publishing (OIDC) — no NPM_TOKEN
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24        # trusted publishing needs Node >= 22.14
          registry-url: https://registry.npmjs.org
      - name: Ensure npm >= 11.5.1 (OIDC support)
        run: npm install -g npm@latest && npm --version
      - name: Publish @mfup/client and @mfup/react (OIDC, provenance auto)
        run: |
          npm ci
          npm run build
          npm publish -w @mfup/client --access public
          npm publish -w @mfup/react --access public

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: release
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-py
          path: dist-py/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-py/
