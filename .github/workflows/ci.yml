name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        runtime:
          - { node: "22.13.0", python: "3.10" }
          - { node: "24", python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.runtime.node }}
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.runtime.python }}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: python -m pip install ./server/mfup-core "./server/mfup-fastapi[dev]"
      - run: python -m pytest server/tests -q
      - run: npm run pack:check
  browsers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        backend: [node, python]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MFUP_BACKEND: ${{ matrix.backend }}
      MFUP_EXTENDED: "1"
      PYTHON_BIN: python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: python -m pip install ./server/mfup-core ./server/mfup-fastapi
      - run: npx playwright install --with-deps chromium firefox webkit chrome msedge
      - run: npm run test:e2e
      - run: npm run test:examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browsers-${{ matrix.os }}-${{ matrix.backend }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  python-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python scripts/build-python.py .tmp/dist-py
      - run: twine check .tmp/dist-py/*
      - run: python scripts/check-artifacts.py .tmp/dist-py
      - run: pip install .tmp/dist-py/*.whl httpx
      - run: python scripts/pack-python-check.py

  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:storage
