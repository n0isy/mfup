name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------------------------------------------------------------------
  # Server unit tests (protocol decoder, native crc32c vectors)
  # ---------------------------------------------------------------------
  server-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server packages (with dev deps)
        run: pip install ./server/mfup-core "./server/mfup-fastapi[dev]"
      - name: Run unit tests
        run: cd server && python -m pytest tests -q

  # ---------------------------------------------------------------------
  # Packaging smoke: the four artifacts must BUILD and INSTALL cleanly —
  # npm tarballs import in Node, wheels pass twine check and import.
  # Catches exports-map / const-enum / metadata regressions before publish.
  # ---------------------------------------------------------------------
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build + pack npm workspaces
        run: |
          npm ci
          npm run build
          mkdir -p /tmp/pack
          npm pack -w @mfup/client -w @mfup/react --pack-destination /tmp/pack

      - name: Install tarballs in a scratch project and import
        run: |
          mkdir /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null
          npm install --no-audit --no-fund /tmp/pack/mfup-client-*.tgz /tmp/pack/mfup-react-*.tgz react@18
          node --input-type=module -e "
          import * as c from '@mfup/client';
          import * as r from '@mfup/react';
          if (typeof c.MfupSession !== 'function') throw new Error('MfupSession missing');
          if (c.FrameTag.NODE !== 1) throw new Error('FrameTag broken');
          if (typeof r.useMfupUpload !== 'function') throw new Error('useMfupUpload missing');
          console.log('npm pack smoke OK');
          "

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build + check + install Python packages
        run: |
          pip install build twine
          python -m build server/mfup-core -o /tmp/dist-py
          python -m build server/mfup-fastapi -o /tmp/dist-py
          twine check /tmp/dist-py/*
          pip install /tmp/dist-py/mfup_core-*.whl /tmp/dist-py/mfup_fastapi-*.whl
          python -c "
          from mfup_fastapi import MfupEngine, MfupConfig
          e = MfupEngine(MfupConfig())
          assert len(e.router.routes) == 8, e.router.routes
          print('wheel smoke OK')
          "

  # ---------------------------------------------------------------------
  # Full-stack e2e on Linux: the real docker-compose stack inside the
  # runner, all three engines, including kill/resume chaos tests.
  # ---------------------------------------------------------------------
  linux-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit

      - name: Wait for stack (backend health + built frontend)
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:20060/health >/dev/null \
               && curl -sf http://localhost:20060/e2e.html | grep -q mfupE2E; then
              curl -s http://localhost:20060/health; exit 0
            fi
            sleep 3
          done
          echo "::error::stack did not become ready in 120s"
          echo "--- backend ---"; docker compose logs backend --tail 50
          echo "--- frontend-build (dist producer) ---"; docker compose logs frontend-build --tail 50
          exit 1

      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose logs backend --tail 200

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: e2e/test-results/
          retention-days: 7

  # ---------------------------------------------------------------------
  # Native WebKit on macOS — the closest CI proxy for real Safari.
  # No Docker on macOS runners → run the stack natively:
  # brew redis + pip server + vite dev server (proxy targets via env).
  # Chaos tests self-skip (they are chromium-only).
  # ---------------------------------------------------------------------
  # macos-15 (not -14): the webkit build on macos-14/arm64 is frozen and
  # rejects Playwright's Page.overrideSetting(PushAPIEnabled), failing every
  # newPage. macos-15 ships a webkit compatible with current Playwright.
  macos-webkit:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start redis
        run: |
          brew install redis
          redis-server --daemonize yes

      - name: Start MFUP backend
        run: |
          pip install ./server/mfup-core ./server/mfup-fastapi
          MFUP_BASE_DIR="$GITHUB_WORKSPACE/uploads" \
          REDIS_URL=redis://localhost:6379/0 \
          nohup python -m uvicorn mfup_fastapi.app:app --port 8070 > backend.log 2>&1 &

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build demo and serve it statically on :20060
        working-directory: demo
        run: |
          npm ci
          MFUP_BACKEND_URL=http://localhost:8070 npm run build
          # `vite preview` serves the static build (no HMR dev server, which
          # hangs the frozen macOS webkit); proxy config lives in vite.config.
          MFUP_BACKEND_URL=http://localhost:8070 \
          nohup npm run preview -- --port 20060 > ../vite.log 2>&1 &

      - name: Install Playwright WebKit
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install webkit

      - name: Wait for stack
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:20060/health >/dev/null \
               && curl -sf http://localhost:20060/e2e.html | grep -q mfupE2E; then
              curl -s http://localhost:20060/health; exit 0
            fi
            sleep 3
          done
          echo "::error::stack did not become ready in 120s"; tail -50 backend.log; tail -30 ../vite.log; exit 1

      - name: Run e2e tests (WebKit)
        working-directory: e2e
        run: npx playwright test --project=webkit

      - name: Dump logs on failure
        if: failure()
        run: |
          tail -100 backend.log || true
          tail -50 vite.log || true
