# Overlay: swap the Python MFUP backend for the Node one (@mfup/server).
#
#   docker compose -f e2e/docker-compose.yaml -f e2e/docker-compose.node.yaml up -d
#
# Everything else (redis, caddy, trivial, frontend-build, the uploads bind
# mount, port 20060) stays identical, so the full Playwright suite — resume
# chaos, meta-loss, abort, retention (which inspects Redis directly) — runs
# unchanged against the Node server. That works because RedisStore uses the
# SAME key layout as the Python SessionIndex.
#
# Requires `npm run build -w @mfup/server` on the host first: the container
# installs only runtime deps (ws + redis) and runs the prebuilt dist/.
services:
  backend:
    image: node:24-alpine
    working_dir: /packages/server
    command: >
      sh -c "npm install --no-audit --no-fund --no-package-lock --omit=dev &&
             npm install --no-audit --no-fund --no-package-lock --no-save redis@^4 &&
             node bin/mfup-server.mjs"
    environment:
      MFUP_BASE_DIR: /data/uploads
      REDIS_URL: redis://redis:6379/0
      MFUP_ADMIN_TOKEN: dev-admin-token
      MFUP_PORT: "8070"
    volumes:
      - ../packages:/packages
      - ../uploads:/data/uploads
      - /packages/server/node_modules
