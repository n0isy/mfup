[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "mfup-fastapi"
version = "3.1.0"
description = "MFUP/3 FastAPI adapter with streaming multipart and WebSocket questions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "n0isy" }]
requires-python = ">=3.10"
dependencies = ["mfup-core==3.1.0", "fastapi>=0.115", "anyio>=4", "uvicorn[standard]>=0.30", "python-multipart>=0.0.20"]
[project.scripts]
mfup-server = "mfup_fastapi.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.28"]
[tool.hatch.build.targets.wheel]
packages = ["mfup_fastapi"]

[project.urls]
Homepage = "https://github.com/n0isy/mfup"
Repository = "https://github.com/n0isy/mfup"
Issues = "https://github.com/n0isy/mfup/issues"

[tool.hatch.build.targets.sdist]
include = ["/mfup_fastapi", "/pyproject.toml", "/README.md", "/README_ru.md", "/LICENSE"]

[tool.hatch.build]
ignore-vcs = true
exclude = ["**/__pycache__/**", "**/*.py[cod]"]
