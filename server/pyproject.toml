[project]
name = "mfup-server"
version = "0.1.0"
description = "MFUP/2 resumable multi-file upload server"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "redis>=5.0.0",
    "crc32c>=2.7",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
