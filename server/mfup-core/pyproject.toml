[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "mfup-core"
version = "3.1.0"
description = "MFUP/3 multipart session engine, durable receipts and interactive publication"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "n0isy" }]
requires-python = ">=3.10"
[tool.hatch.build.targets.wheel]
packages = ["mfup_core"]

[project.urls]
Homepage = "https://github.com/n0isy/mfup"
Repository = "https://github.com/n0isy/mfup"
Issues = "https://github.com/n0isy/mfup/issues"

[tool.hatch.build.targets.sdist]
include = ["/mfup_core", "/pyproject.toml", "/README.md", "/README_ru.md", "/LICENSE"]

[tool.hatch.build]
ignore-vcs = true
exclude = ["**/__pycache__/**", "**/*.py[cod]"]
