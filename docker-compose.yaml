services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    expose:
      - "8070"
    command: >
      sh -c "pip install --quiet fastapi uvicorn[standard] websockets &&
             python -m uvicorn mfup.app:app --host 0.0.0.0 --port 8070 --log-level info"
    environment:
      MFUP_BASE_DIR: /data/uploads
    volumes:
      - ./server:/app
      - ./uploads:/data/uploads

  frontend:
    image: node:20-alpine
    working_dir: /app
    expose:
      - "3000"
    command: sh -c "npm install && npx vite"
    volumes:
      - ./example:/app
      - ./client:/client

  caddy:
    image: caddy:2-alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "20060:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

