# The MAIN application of this repo: the consumer example
# (examples/multiuser-scopes) running exactly the way an outside integrator
# would run it — server deps from PyPI, client deps from npm, nothing built
# from this repo's sources.
#
#   docker compose up -d      →  http://localhost:20061
#
# Uploaded files land in ./uploads/<user_id>/<scope>/… on the host.
#
# The INTERNAL dev/test stack (protocol e2e harness, chaos tests, benchmark
# baseline) lives separately: docker compose -f e2e/docker-compose.yaml up -d
# → :20060.

services:
  redis:
    image: redis:7-alpine
    expose:
      - "6379"

  server:
    image: python:3.12-slim
    working_dir: /app
    depends_on:
      - redis
    expose:
      - "8090"
    # Straight from the example's own README: venv-less container flavour.
    command: >
      sh -c "pip install --quiet -r requirements.txt &&
             python -m uvicorn app:app --host 0.0.0.0 --port 8090 --log-level info"
    environment:
      DEMO_DATA_DIR: /data/uploads
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./examples/multiuser-scopes/server:/app
      - ./uploads:/data/uploads

  client:
    image: node:20-alpine
    working_dir: /app
    depends_on:
      - server
    ports:
      - "20061:20061"
    # vite dev server (hot reload); its /api proxy targets the server service.
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      EXAMPLE_BACKEND_URL: http://server:8090
    volumes:
      - ./examples/multiuser-scopes/client:/app
      # never extract npm packages into the bind-mounted host dir
      - /app/node_modules
