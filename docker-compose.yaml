services:
  redis:
    image: redis:7-alpine
    expose:
      - "6379"

  backend:
    image: python:3.12-slim
    working_dir: /app
    depends_on:
      - redis
    expose:
      - "8070"
    command: >
      sh -c "pip install --quiet fastapi uvicorn[standard] websockets redis &&
             python -m uvicorn mfup.app:app --host 0.0.0.0 --port 8070 --log-level info"
    environment:
      MFUP_BASE_DIR: /data/uploads
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./server:/app
      - ./uploads:/data/uploads

  trivial:
    image: python:3.12-slim
    working_dir: /app
    expose:
      - "8071"
    command: >
      sh -c "pip install --quiet fastapi uvicorn[standard] python-multipart &&
             python -m uvicorn app:app --host 0.0.0.0 --port 8071 --log-level info"
    environment:
      UPLOAD_DIR: /data/uploads/trivial-target
    volumes:
      - ./trivial-server:/app
      - ./uploads:/data/uploads

  frontend:
    image: node:20-alpine
    working_dir: /app
    expose:
      - "3000"
    command: sh -c "npm install && npx vite"
    volumes:
      - ./example:/app
      - ./client:/client

  caddy:
    image: caddy:2-alpine
    depends_on:
      - backend
      - frontend
      - trivial
    ports:
      - "20060:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./example/dist:/srv/dist:ro
