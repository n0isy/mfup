services:
  node:
    image: node:24-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run build && node --watch examples/multiuser-scopes-node/server/server.mjs"
    environment:
      PORT: "3001"
      DEMO_DATA_DIR: /app/data/example-node
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
    volumes:
      - .:/app
      - mfup3_modules:/app/node_modules
    expose: ["3001"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/mfup/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 30s
  python:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install -e ./server/mfup-core -e ./server/mfup-fastapi && python -m uvicorn app:create_example --factory --app-dir examples/multiuser-scopes/server --host 0.0.0.0 --port 8090 --reload --reload-dir examples/multiuser-scopes/server --reload-dir server"
    environment:
      DEMO_DATA_DIR: /app/data/example-python
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
    volumes:
      - .:/app
    expose: ["8090"]
  client:
    image: node:24-bookworm-slim
    working_dir: /app
    command: npm run dev -w @mfup/example-client
    environment:
      PORT: "3000"
      EXAMPLE_BACKEND_URL: http://node:3001
    volumes:
      - .:/app
      - mfup3_modules:/app/node_modules:ro
    expose: ["3000"]
    depends_on:
      node:
        condition: service_healthy
  client-python:
    image: node:24-bookworm-slim
    working_dir: /app
    command: npm run dev -w @mfup/example-client
    environment:
      PORT: "3000"
      EXAMPLE_BASE: /python/
      EXAMPLE_BACKEND_URL: http://python:8090
    volumes:
      - .:/app
      - mfup3_modules:/app/node_modules:ro
    expose: ["3000"]
    depends_on:
      node:
        condition: service_healthy
      python:
        condition: service_started
  caddy:
    image: caddy:2-alpine
    depends_on: [client, client-python]
    ports: ["20060:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
volumes:
  mfup3_modules:
