services:
  redis:
    image: redis:7-alpine
    expose:
      - "6379"

  backend:
    image: python:3.12-slim
    working_dir: /app
    depends_on:
      - redis
    expose:
      - "8070"
    command: >
      sh -c "pip install --quiet fastapi uvicorn[standard] websockets redis crc32c &&
             python -m uvicorn mfup_fastapi.app:app --host 0.0.0.0 --port 8070 --log-level info"
    environment:
      MFUP_BASE_DIR: /data/uploads
      REDIS_URL: redis://redis:6379/0
      MFUP_ADMIN_TOKEN: dev-admin-token
      # Both split packages straight from the bind mount (no pip -e).
      PYTHONPATH: /app/mfup-core:/app/mfup-fastapi
    volumes:
      - ./server:/app
      - ./uploads:/data/uploads

  trivial:
    image: python:3.12-slim
    working_dir: /app
    expose:
      - "8071"
    command: >
      sh -c "pip install --quiet fastapi uvicorn[standard] python-multipart &&
             python -m uvicorn app:app --host 0.0.0.0 --port 8071 --log-level info"
    environment:
      UPLOAD_DIR: /data/uploads/trivial-target
    volumes:
      - ./benchmarks/trivial-server:/app
      - ./uploads:/data/uploads

  # Optional hot-reload dev server. Behind the `dev` profile so a plain
  # `docker compose up` does NOT start it — otherwise it and frontend-build
  # both `npm ci` into the same bind-mounted ./demo concurrently, clobber
  # each other's node_modules, and the build fails ("vite: not found").
  frontend:
    image: node:20-alpine
    working_dir: /app
    profiles: ["dev"]
    expose:
      - "3000"
    # npm ci + npm run (local vite from the lockfile) — never `npx vite`,
    # which fetches the latest vite (v8/rolldown) from the registry and
    # breaks the build when local resolution hiccups.
    command: sh -c "npm ci && npm run dev"
    volumes:
      - ./demo:/app
      # vite aliases ../packages/{client,react}/src → /packages/... in-container
      - ./packages:/packages
      # per-container node_modules (anonymous volume): never extract npm
      # packages into the bind-mounted host dir, and never share them.
      - /app/node_modules

  frontend-build:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run build"
    volumes:
      - ./demo:/app
      - ./packages:/packages
      - /app/node_modules

  caddy:
    image: caddy:2-alpine
    depends_on:
      - backend
      - frontend-build
      - trivial
    ports:
      - "20060:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./demo/dist:/srv/dist:ro
