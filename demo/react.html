<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MFUP/2 — React demo (@mfup/react)</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, sans-serif; background: #101418; color: #dde3ea; margin: 0; padding: 2rem; }
    .react-demo { max-width: 640px; margin: 0 auto; display: grid; gap: 1rem; }
    .dropzone { border: 2px dashed #3a4652; border-radius: 12px; padding: 2rem; text-align: center; transition: border-color .15s, background .15s; }
    .dropzone.dragover { border-color: #4da3ff; background: #16202b; }
    .dropzone label { display: inline-block; margin: 0 .5rem; padding: .4rem .8rem; background: #1d2833; border-radius: 8px; cursor: pointer; }
    .dropzone input[type=file] { display: none; }
    progress { width: 100%; height: 10px; }
    .ask { background: #2b2013; border: 1px solid #7a5c1e; border-radius: 8px; padding: .8rem; display: flex; gap: .8rem; align-items: center; }
    .ask button { padding: .3rem .8rem; border-radius: 6px; border: 0; cursor: pointer; }
    button[data-testid=ask-overwrite] { background: #2f6f3f; color: #fff; }
    button[data-testid=ask-cancel] { background: #6f2f2f; color: #fff; }
    pre { background: #0b0e11; border-radius: 8px; padding: .8rem; font-size: 12px; overflow-x: auto; min-height: 3rem; }
    .badge { font-weight: 600; letter-spacing: .05em; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/react-demo.tsx"></script>
</body>
</html>
